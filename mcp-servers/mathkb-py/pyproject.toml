# mathforge-mathkb: RAG MCP server (search_math_knowledge tool).
# Own venv, independent of agent-core/ — see repo root README "Architecture".

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathforge-mathkb"
version = "0.1.0"
description = "MCP server exposing search_math_knowledge (Qdrant + Voyage embeddings)"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "qdrant-client==1.19.1",
    "voyageai==0.5.0",
    # See agent-core/pyproject.toml's identical pin for why this is needed
    # despite not being imported: `[build-system] requires` above doesn't
    # upgrade an already-present setuptools in the target env, so an old
    # ambient one (e.g. CI's Python 3.11) stays vulnerable (PYSEC-2026-3447)
    # unless pinned here too. Verified fixed on the same repro that found it.
    "setuptools>=83",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.setuptools]
py-modules = ["chunking", "ingest", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
