# mathforge-mathkb: RAG MCP server (search_math_knowledge tool).
# Own venv, independent of agent-core/ — see repo root README "Architecture".

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathforge-mathkb"
version = "0.1.0"
description = "MCP server exposing search_math_knowledge (Qdrant + Voyage embeddings)"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "qdrant-client==1.19.0",
    "voyageai==0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.setuptools]
py-modules = ["chunking", "ingest", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
