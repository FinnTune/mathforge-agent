[package]
name = "mathforge-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
governor = "0.10.4"
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
