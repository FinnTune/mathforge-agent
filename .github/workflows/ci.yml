# Continuous integration: lint + tests on every push/PR to main or master.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  agent-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-core
    strategy:
      matrix:
        # Match pyproject requires-python; catch version-specific failures early.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Editable install pulls runtime + dev deps from pyproject.toml.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          # load_settings() requires a non-empty key; tests mock the LLM, not the API.
          ANTHROPIC_API_KEY: dummy-for-ci
        run: pytest -q

  sandbox-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/sandbox-rs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-servers/sandbox-rs
      # The sandbox preamble unconditionally imports numpy/sympy/matplotlib/
      # scipy, so every test — even `print("hello")` — needs a Python with
      # them installed; MATHFORGE_SANDBOX_PYTHON points the tests at it.
      - name: Set up sandboxed Python env
        run: |
          python3 -m venv .venv-sandbox-test
          .venv-sandbox-test/bin/pip install -r requirements.txt
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        env:
          MATHFORGE_SANDBOX_PYTHON: ${{ github.workspace }}/mcp-servers/sandbox-rs/.venv-sandbox-test/bin/python
        run: cargo test

  mathkb-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/mathkb-py
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      # No Docker/Qdrant and no VOYAGE_API_KEY needed: tests use qdrant-client's
      # embedded (":memory:") mode and a fake, deterministic embedder.
      - name: Pytest
        run: pytest -q
