# Continuous integration: lint + tests on every push/PR to main or master.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  agent-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-core
    strategy:
      matrix:
        # Match pyproject requires-python; catch version-specific failures early.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Editable install pulls runtime + dev deps (incl. grpcio-tools) from pyproject.toml.
      - name: Install
        run: pip install -e ".[dev]"
      # Fails the build on a disclosed CVE in any installed dependency —
      # --local audits exactly the env `pip install` above just built.
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --local
      # Generated stubs are gitignored — regenerate before lint/test, same as
      # the Rust sandbox binary is built before its own tests below.
      - name: Generate protobuf/gRPC stubs
        run: bash ../scripts/generate_proto.sh
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          # load_settings() requires a non-empty key; tests mock the LLM, not the API.
          ANTHROPIC_API_KEY: dummy-for-ci
        run: pytest -q

  sandbox-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/sandbox-rs
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-servers/sandbox-rs
      # The sandbox preamble unconditionally imports numpy/sympy/matplotlib/
      # scipy, so every test — even `print("hello")` — needs a Python with
      # them installed; MATHFORGE_SANDBOX_PYTHON points the tests at it.
      - name: Set up sandboxed Python env
        run: |
          python3 -m venv .venv-sandbox-test
          .venv-sandbox-test/bin/pip install -r requirements.txt
      # Prebuilt binary via taiki-e/install-action — compiling cargo-audit
      # from source on every run is slow; this installs a release instead.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        env:
          MATHFORGE_SANDBOX_PYTHON: ${{ github.workspace }}/mcp-servers/sandbox-rs/.venv-sandbox-test/bin/python
        run: cargo test

  gateway-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-rs
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway-rs
      # build.rs (tonic-prost-build -> prost-build) needs a real `protoc` on
      # PATH — recent prost-build no longer vendors/downloads one itself.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # No Python/Docker dependency — the fake upstream in tests/ is pure Rust.
      - name: Test
        run: cargo test

  # Builds both Dockerfiles (added in Phase 8) on every push — a broken
  # Dockerfile (e.g. the PATH/venv bug this job would have caught) otherwise
  # only surfaces via a manual `docker compose build`. Build-only, no run:
  # running `agent`'s image needs a real ANTHROPIC_API_KEY, out of scope
  # here — the other jobs above already cover the underlying code.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build agent-core image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent-core/Dockerfile
          push: false
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - name: Build gateway-rs image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway-rs/Dockerfile
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  mathkb-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/mathkb-py
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --local
      - name: Ruff
        run: ruff check .
      # No Docker/Qdrant and no VOYAGE_API_KEY needed: tests use qdrant-client's
      # embedded (":memory:") mode and a fake, deterministic embedder.
      - name: Pytest
        run: pytest -q
