// MathForge chat service — one long-running agent-core server, many thin
// clients (CLI, Discord bot, and later the Phase 5 Rust gateway).
syntax = "proto3";

package mathforge;

service MathForgeChat {
  // Server-streaming: one query in, a stream of events as the agent works.
  // Only TextDelta carries user-facing text (the responder node's output —
  // see agent-core/agent.py); ToolCall/ToolResult are for --verbose display.
  rpc Chat(ChatRequest) returns (stream ChatEvent);

  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message ChatRequest {
  // Client-generated; scopes conversation memory (see checkpointer.py).
  // "Reset" is purely client-side — just send a new thread_id.
  string thread_id = 1;
  string query = 2;
}

message ChatEvent {
  oneof event {
    TextDelta text_delta = 1;
    ToolCall tool_call = 2;
    ToolResult tool_result = 3;
    Done done = 4;
    Error error = 5;
  }
}

message TextDelta {
  string text = 1;
}

message ToolCall {
  string tool_name = 1;
  string args_json = 2;
}

message ToolResult {
  string tool_name = 1;
  string result = 2;
}

// Terminal event on success; stream closes after this (or after Error).
message Done {}

message Error {
  string message = 1;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ok = 1;
  string model = 2;
}
