# MathForge packaging and tool configuration (PEP 621).
# Install: pip install -e ".[dev]"   (editable + dev dependencies)

[build-system]
# Build backend for creating wheels / editable installs.
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathforge-agent"
version = "0.2.0"
description = "LangGraph + Claude math agent with sandboxed Python execution"
# No `readme =`: setuptools refuses to read files outside the package root
# (this manifest lives in agent-core/, README.md is at the repo root).
requires-python = ">=3.11"
dependencies = [
    # Agent runtime: LangGraph (hand-rolled planner/tools/verifier/responder
    # graph, see agent.py) + Anthropic chat model.
    "langgraph==1.1.8",
    "langchain-anthropic==1.4.6",
    # langchain-mcp-adapters pulls in a newer langchain-core than the previous
    # exact pin (1.3.0); range verified compatible with langgraph/anthropic above.
    "langchain-core>=1.6.2,<2",
    "python-dotenv==1.2.2",
    "discord.py>=2.4,<3",
    # MCP client: loads tools (sandbox + mathkb servers) as LangChain tools.
    "langchain-mcp-adapters==0.3.2",
    # Persistent (SQLite-backed) LangGraph checkpointer — see checkpointer.py.
    "langgraph-checkpoint-sqlite==3.1.1",
    # gRPC: grpc_server.py serves the agent; main.py/discord_bot.py are thin
    # clients (see proto/chat.proto). Generated stubs: scripts/generate_proto.sh.
    "grpcio==1.83.1",
    # Distributed tracing (see telemetry.py) — the plain opentelemetry-api's
    # default tracer is a safe no-op, so these are always imported but only
    # do real work (export spans) when MATHFORGE_OTLP_ENDPOINT is set.
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
]

[project.optional-dependencies]
# Lint + test; not needed for `pip install .` in production.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    # protoc codegen only — not needed at runtime, see scripts/generate_proto.sh.
    "grpcio-tools==1.83.1",
    # Generates throwaway self-signed certs in TLS tests (test_grpc_server.py) —
    # explicit dev dep rather than relying on it being present transitively.
    "cryptography>=43",
]

[project.scripts]
# After install: `mathforge` on PATH calls `main.main()`.
mathforge = "main:main"
mathforge-discord = "discord_bot:main"
mathforge-server = "grpc_server:main"

[tool.setuptools]
# Flat layout: top-level modules, not a `src/` package. chat_pb2/chat_pb2_grpc
# are generated (scripts/generate_proto.sh) and gitignored, not present until
# that script runs.
py-modules = [
    "agent",
    "chat_pb2",
    "chat_pb2_grpc",
    "checkpointer",
    "config",
    "discord_bot",
    "grpc_server",
    "main",
    "mcp_client",
    "telemetry",
]

[tool.pytest.ini_options]
# pytest-asyncio: async tests without explicit loop fixtures.
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Upstream noise during test runs.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes; I: isort; UP: pyupgrade.
select = ["E", "F", "I", "UP"]
